name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python test_suite.py

      - name: Build Standalone Executable
        run: |
          python build_exe.py

      - name: Prepare Release Package
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v2.1.0" }
          $zipName = "GameMacro-$tag-windows-x64.zip"
          
          # 릴리즈용 패키지 폴더 구성
          New-Item -ItemType Directory -Force -Path "package/GameMacro"
          Copy-Item "dist/GameMacro.exe" -Destination "package/GameMacro/"
          Copy-Item "templates" -Destination "package/GameMacro/" -Recurse
          Copy-Item "profiles" -Destination "package/GameMacro/" -Recurse -ErrorAction SilentlyContinue
          Copy-Item "targets_config.json" -Destination "package/GameMacro/" -ErrorAction SilentlyContinue
          Copy-Item "README.md" -Destination "package/GameMacro/"
          Copy-Item "LICENSE" -Destination "package/GameMacro/"
          
          # 압축 파일 생성
          Compress-Archive -Path "package/GameMacro/*" -DestinationPath $zipName -Force
          Write-Host "Created release archive: $zipName"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: GameMacro-*-windows-x64.zip
          generate_release_notes: true
